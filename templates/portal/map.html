{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}
{% block content %}
<p class="eyebrow">Live map</p>
<h1>Open requests</h1>
<p class="lede small">OpenStreetMap tiles. If tiles fail to load, the markers and the
queue still work: the map is a convenience, not the record.</p>
<div id="map" style="margin-top:16px"></div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLOUR = {RED:'#b32b23', ORANGE:'#d06a18', YELLOW:'#c08e05', GREEN:'#2c7a55'};
const map = L.map('map').setView([25.6, 85.1], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);

fetch('{% url "map_json" %}').then(r => r.json()).then(data => {
  const layer = L.geoJSON(data, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      radius: f.properties.priority === 'RED' ? 10 : 7,
      color: '#14181b', weight: 1,
      fillColor: COLOUR[f.properties.priority] || '#2c7a55',
      fillOpacity: f.properties.breached ? 1 : 0.75
    }),
    onEachFeature: (f, l) => {
      const p = f.properties;
      l.bindPopup(
        `<b>#${p.id} ${p.habitation}</b><br>${p.priority} &middot; score ${p.score}` +
        `<br>${p.state} &middot; ${p.access_mode}<br>${p.needs.join(', ')}` +
        `<br>${p.breached ? '<b>SLA breached</b>' : p.hours_left + ' h left'}` +
        `<br><a href="/control/request/${p.id}/">Open request</a>`
      );
    }
  }).addTo(map);
  if (data.features.length) map.fitBounds(layer.getBounds(), {padding: [40, 40]});
});
</script>
{% endblock %}
